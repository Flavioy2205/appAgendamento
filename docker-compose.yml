version: '3.8'

services:
  database:
    image: postgres:15
    container_name: pilates_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pilatesdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  evolution_api:
    image: atendai/evolution-api:v1.8.7
    platform: linux/amd64
    container_name: evolution_api
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=pilates-evolution-api-key-123

  evolution_manager:
    image: atendai/evolution-manager:latest
    platform: linux/amd64
    container_name: evolution_manager
    restart: always
    ports:
      - "8082:8080"
    environment:
      - EVOLUTION_API_URL=http://localhost:8081
      - EVOLUTION_API_KEY=pilates-evolution-api-key-123

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pilates_backend
    environment:
      - DB_HOST=database
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=pilatesdb
    ports:
      - "8080:8080"
    depends_on:
      - database
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pilates_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
